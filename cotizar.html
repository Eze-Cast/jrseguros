<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a1d33" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="Antes de cotizar con JR Seguros, conoce el correo desde el que recibirás tu cotización y continúa al servicio externo." />
  <title>Antes de cotizar | JR Seguros</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="stylesheet" href="css/estilo.css?v=carga-20261118" />
  <script src="js/contenido.js?v=carga-20261118"></script>
  <style>
    body { min-height: 100svh; display: grid; place-items: center; padding: 24px; background: var(--ink); color: #fff; overflow: hidden; }
    .glow { position: fixed; width: 800px; height: 800px; left: 50%; top: 50%; margin: -400px; border-radius: 50%; background: radial-gradient(circle, rgba(26,165,228,.4), transparent 60%); animation: breathe 6s ease-in-out infinite; }
    .card-q { position: relative; width: min(520px, 100%); background: var(--white); color: var(--ink); border-radius: 32px; padding: 44px 38px 34px; text-align: center; box-shadow: 0 40px 90px -30px rgba(0,0,0,.6); animation: msgIn .9s var(--ease) both; }
    .ring { width: 108px; height: 108px; margin: 0 auto 26px; position: relative; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 6; }
    .ring .bg { stroke: var(--sky-soft); }
    .ring .fg { stroke: var(--sky); stroke-linecap: round; stroke-dasharray: 302; stroke-dashoffset: 0; animation: countdown 3s linear forwards; }
    .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--head); font-size: 2.4rem; font-weight: 800; }
    @keyframes countdown { to { stroke-dashoffset: 302; } }
    h1 { font-size: clamp(1.7rem, 4vw, 2.2rem); margin: 6px 0 14px; }
    p { color: var(--ink-2); margin: 0 0 14px; }
    .mail { display: inline-block; font-weight: 700; color: var(--ink); background: var(--sky-soft); padding: 4px 12px; border-radius: 999px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 24px; }
    .legal { margin-top: 22px; font-size: .8rem; color: var(--muted); }
    .legal a { text-decoration: underline; }
  </style>
</head>
<body class="loaded ready">
  <div class="glow" aria-hidden="true"></div>
  <main class="card-q" aria-labelledby="t">
    <div class="ring" aria-hidden="true">
      <svg viewBox="0 0 108 108"><circle class="bg" cx="54" cy="54" r="48" /><circle class="fg" cx="54" cy="54" r="48" /></svg>
      <b id="n">3</b>
    </div>
    <p class="eyebrow">Antes de cotizar</p>
    <h1 id="t">Tu cotización llegará a tu correo</h1>
    <p>Si completas el proceso, recibirás un correo de <span class="mail">tuseguro@aarco.com.mx</span></p>
    <p>Revisa tu bandeja de entrada y la carpeta de correo no deseado.</p>
    <p role="status" aria-live="polite" id="s">Abriremos el cotizador en 3 segundos.</p>
    <div class="row">
      <a class="btn btn-primary btn-sm" id="go" href="https://www.cotizamatico.com.mx/landing/ramon.garciag" rel="noreferrer">Ir ahora <span class="arrow">↗</span></a>
      <a class="btn btn-ghost btn-sm" id="cancel" href="/">Cancelar y volver</a>
    </div>
    <p class="legal"><a href="/aviso-legal.html">Aviso legal</a> · <a href="/privacidad.html">Privacidad</a> · <a href="/cookies.html">Cookies</a></p>
  </main>
  <script>
    (() => {
      const C = window.JR_CONTENIDO || {};
      const url = (C.contacto && C.contacto.cotizador) || "https://www.cotizamatico.com.mx/landing/ramon.garciag";
      document.getElementById("go").href = url;
      let s = 3, cancelled = false;
      const n = document.getElementById("n"), st = document.getElementById("s");
      const t = setInterval(() => {
        s--; n.textContent = Math.max(s, 0);
        st.textContent = s > 0 ? `Abriremos el cotizador en ${s} segundo${s === 1 ? "" : "s"}.` : "Abriendo el cotizador…";
        if (s <= 0) { clearInterval(t); if (!cancelled) location.replace(url); }
      }, 1000);
      document.getElementById("cancel").addEventListener("click", () => { cancelled = true; clearInterval(t); });
    })();
  </script>
  <noscript><p>Para continuar, <a href="https://www.cotizamatico.com.mx/landing/ramon.garciag" rel="noreferrer">abre el cotizador</a>.</p></noscript>
</body>
</html>
