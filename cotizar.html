<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#081a2d" />
    <meta name="robots" content="noindex" />
    <title>Antes de cotizar | JR Seguros</title>
    <link rel="icon" href="assets/images/optimized/favicon.png" type="image/png" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/cotizador.css?v=aviso-3s-v2" />
    <script src="js/contenido.js?v=aviso-3s-v2" defer></script>
    <script src="js/cotizador.js?v=aviso-3s-v2" defer></script>
  </head>
  <body class="quote-page">
    <main class="quote-dialog" aria-labelledby="quote-title">
      <div class="quote-content">
        <span class="quote-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" /><path d="m4 7 8 6 8-6" /></svg>
        </span>
        <p class="eyebrow dark">ANTES DE COTIZAR</p>
        <h1 id="quote-title">Tu cotización llegará a tu correo</h1>
        <p id="quote-description">
          Si completas el proceso de cotización, recibirás un correo de
          <strong class="quote-email">tuseguro@aarco.com.mx</strong>
          Revisa tu bandeja de entrada y la carpeta de correo no deseado.
        </p>
        <p id="quote-countdown" class="quote-countdown" role="status" aria-live="polite" aria-atomic="true">
          Abriremos el cotizador en <strong><span id="quote-seconds">3</span> segundos</strong>.
        </p>
        <button class="quote-cancel" id="quote-cancel" type="button">Cancelar y volver a JR Seguros</button>
        <noscript>
          <p>Para continuar, <a class="text-link" href="https://www.cotizamatico.com.mx/landing/ramon.garciag" rel="noreferrer">abre el cotizador</a>.</p>
        </noscript>
      </div>
    </main>
  </body>
</html>
